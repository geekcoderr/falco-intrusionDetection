rules_files:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml

plugins:
  - name: container
    library_path: libcontainer.so
    init_config:
      label_max_len: 100
      with_size: false

load_plugins: [container]

json_output: true
json_include_output_property: true

http_output:
  enabled: true
  url: "http://alert-router:8080/alert"

priority: warning

log_stderr: true
log_syslog: false
