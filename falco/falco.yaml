rules_file:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml

json_output: true
json_include_output_property: true

http_output:
  enabled: true
  url: "http://alert-router:8080/alert"

# Reduce noise - only send Warning and above to the router
priority: warning

# Log to stdout as well for docker logs debugging
log_stderr: true
log_syslog: false
