rules_files:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml

# Load the container plugin required by default rules in Falco 0.44+
plugins:
  - name: container
    library_path: libcontainer.so
    init_config:
      engines:
        docker:
          enabled: true

load_plugins: [container]

json_output: true
json_include_output_property: true

http_output:
  enabled: true
  url: "http://alert-router:8080/alert"

# Only Warning and above
priority: warning

log_stderr: true
log_syslog: false
